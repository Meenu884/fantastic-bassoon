<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantastic Bassoon Quest</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Fantastic Bassoon Quest</h1>
      <p class="intro">
        Gather the glowing notes, dodge the shadow squawks, and reach 12 points to win.
      </p>

      <section class="hud" aria-label="Game status">
        <span>Score: <strong id="score">0</strong></span>
        <span>Lives: <strong id="lives">3</strong></span>
      </section>

      <canvas id="gameCanvas" width="760" height="420"></canvas>

      <p class="controls">Use WASD or the arrow keys to move. Press Enter to restart.</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
